[package]
name = "spike-iced"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "SPIKE (Stufe 0): Machbarkeitsprobe der neuen Oberflaeche mit Iced. Kein Produktcode, wird nach dem Messbericht verworfen oder ersetzt."
publish = false

[[bin]]
name = "vc-spike-iced"
path = "src/main.rs"

[dependencies]
iced = { version = "=0.14.0", features = ["canvas", "tokio", "advanced", "image"] }
vc-asm = { path = "../../crates/vc-asm" }
vc-ide = { path = "../../crates/vc-ide" }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "=1.54.1", features = ["rt"] }
rfd = "=0.17.2"

[target.'cfg(target_os = "macos")'.dependencies]
muda = "=0.17.2"
accesskit = "=0.25.2"
accesskit_macos = "=0.27.2"
raw-window-handle = "=0.6.2"
objc2 = "=0.5.2"
objc2-foundation = { version = "=0.2.2", features = ["NSString", "NSArray", "NSObject"] }

# Eigener Arbeitsbereich: der Spike gehört nicht zum Hauptarbeitsbereich (Stufe 0 ist abgeschlossen; Messbericht: assets/docs/Spike-Iced-Messbericht.md).
[workspace]
