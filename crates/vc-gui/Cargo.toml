[package]
name = "vc-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VintageCoder: neue Oberflaeche mit Iced (Programm vintagecoder)"

[[bin]]
name = "vintagecoder"
path = "src/main.rs"

[dependencies]
iced = { version = "=0.14.0", features = ["canvas", "tokio", "advanced", "image"] }
vc-gui-ui = { path = "../vc-gui-ui" }
vc-ide-model = { path = "../vc-ide-model" }
vc-md = { path = "../vc-md" }
vc-basic = { path = "../vc-basic" }
vc-disk = { path = "../vc-disk" }
vc-gui-editor = { path = "../vc-gui-editor" }
vc-asm = { path = "../vc-asm" }
vc-ide = { path = "../vc-ide" }
vc-lsp = { path = "../vc-lsp" }
vc-core = { path = "../vc-core" }
vc-i18n = { path = "../vc-i18n" }
vc-media = { path = "../vc-media" }
vc-roms = { path = "../vc-roms" }
vc-emu = { path = "../vc-emu" }
vc-target = { path = "../vc-target" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "=1.54.1", features = ["rt"] }
rfd = "=0.17.2"
cpal = "=0.18.2"

[target.'cfg(target_os = "macos")'.dependencies]
muda = "=0.17.2"
accesskit = "=0.25.2"
accesskit_macos = "=0.27.2"
raw-window-handle = "=0.6.2"
objc2 = "=0.5.2"
objc2-foundation = { version = "=0.2.2", features = ["NSString", "NSArray", "NSObject"] }

[dev-dependencies]
iced_runtime = "=0.14.0"
iced_renderer = "=0.14.0"
iced_tiny_skia = "=0.14.1"
iced_graphics = "=0.14.0"
tiny-skia = { version = "=0.11.4", features = ["png-format"] }
