<!doctype html><meta charset="utf-8"><title>Hover-Karten Entwurf</title>
<style>
:root{--bg:#0f1115;--card:#171a20;--raise:#1e222a;--line:#2a2f3a;--text:#e6e8ec;--dim:#98a0ae;--faint:#6b7280;--accent:#8b7cf6;--accent2:#b3a8ff;--accentbg:rgba(139,124,246,.16);--ok:#4ade80;--warn:#fbbf24;--code:#12151b;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;--ui:-apple-system,"Inter",system-ui,sans-serif}
.light{--bg:#eceef3;--card:#ffffff;--raise:#f4f5f9;--line:#d9dce5;--text:#1b1e26;--dim:#5b6372;--faint:#8a92a1;--accent:#6c5ce7;--accent2:#5546d4;--accentbg:rgba(108,92,231,.12);--ok:#15803d;--warn:#b45309;--code:#f1f2f7}
.contrast{--bg:#000;--card:#000;--raise:#101018;--line:#fff;--text:#fff;--dim:#e0e0e0;--faint:#cfcfcf;--accent:#ffd400;--accent2:#ffd400;--accentbg:rgba(255,212,0,.18);--ok:#3dff7a;--warn:#ffd400;--code:#0a0a12}
body{margin:0;padding:28px;background:var(--bg);color:var(--text);font:13px/1.5 var(--ui);width:1400px}
h1{font-size:15px;margin:0 0 4px} .sub{color:var(--dim);margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 28px;align-items:start}
.lab{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin:0 0 6px}
code,.m{font-family:var(--mono)}
/* gemeinsam */
.c{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 26px rgba(0,0,0,.35);overflow:hidden;max-width:440px}
.c table{border-collapse:collapse;width:100%;font-size:12px}
.c td,.c th{padding:3px 8px;text-align:left}
.c th{color:var(--faint);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.c .num{text-align:right;font-family:var(--mono)}
.here td{background:var(--accentbg);color:var(--accent2);font-weight:600}
.pill{display:inline-block;padding:1px 7px;border-radius:999px;background:var(--raise);border:1px solid var(--line);font:11px var(--mono);margin-right:4px}
.ex{font-family:var(--mono);background:var(--code);border-radius:6px;padding:5px 8px;font-size:12px;display:block}
/* A: klassisch, Gliederung */
.A .hd{padding:10px 14px 8px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:10px}
.A .t{font:700 15px var(--mono);color:var(--accent2)} .A .k{color:var(--dim)}
.A .bd{padding:10px 14px 12px;display:flex;flex-direction:column;gap:9px}
.A h4{margin:0;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.A .ft{padding:7px 14px;background:var(--raise);border-top:1px solid var(--line);color:var(--dim);font-size:12px}
.A .ft b{color:var(--text)}
/* B: Kopfband */
.B .hd{padding:9px 14px;background:linear-gradient(90deg,var(--accentbg),transparent);display:flex;align-items:center;gap:10px}
.B .t{font:700 14px var(--mono);background:var(--accent);color:#fff;border-radius:6px;padding:1px 8px}
.light .B .t{color:#fff} .contrast .B .t{color:#000}
.B .k{font-weight:600} .B .bd{padding:8px 14px 12px;display:flex;flex-direction:column;gap:8px}
.B .box{border:1px solid var(--accent);border-radius:8px;padding:6px 9px;background:var(--accentbg)}
.B h4{margin:0;font-size:11px;color:var(--dim);font-weight:600}
/* C: zwei Spalten */
.C{max-width:520px}
.C .row{display:grid;grid-template-columns:150px 1fr}
.C .l{padding:12px 14px;border-right:1px solid var(--line);background:var(--raise);display:flex;flex-direction:column;gap:6px}
.C .t{font:700 18px var(--mono);color:var(--accent2)} .C .k{color:var(--dim);font-size:12px}
.C .r{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.C .ft{grid-column:1/3;border-top:1px solid var(--line);padding:6px 14px;font-size:12px;color:var(--dim)}
.C .ft b{color:var(--accent2)}
.diag{border-left:3px solid var(--warn);background:var(--raise);padding:6px 9px;border-radius:6px;font-size:12px}
.mock{display:none}
</style>
<body id="b"><h1>Hover-Karten – Entwurf</h1><p class="sub" id="sub"></p><div class="grid" id="g"></div>
<script>
const P=new URLSearchParams(location.search), V=P.get("v")||"A", TH=P.get("t")||"dark"; document.body.className=TH;
document.getElementById("sub").textContent="Variante "+V+" · Thema "+TH+" · Beispiele: lda, jmp, STERNE (BASIC), #if (BASIC)";
const lda=[["Indirekt, X-vorindiziert (izx)","$A1",2,"6"],["Zeropage (zp)","$A5",2,"3"],["Sofortwert (imm)","$A9",2,"2",1],["Absolut (abs)","$AD",3,"4"],["Indirekt, Y-nachindiziert (izy)","$B1",2,"5+1"],["Zeropage, X-indiziert (zpx)","$B5",2,"4"],["Absolut, Y-indiziert (aby)","$B9",3,"4+1"],["Absolut, X-indiziert (abx)","$BD",3,"4+1"]];
const jmp=[["Absolut (abs)","$4C",3,"3",1],["Indirekt (ind)","$6C",3,"5"]];
const tab=(rows)=>`<table><tr><th>Modus</th><th class="num">Opcode</th><th class="num">Bytes</th><th class="num">Zyklen</th></tr>${rows.map(r=>`<tr class="${r[4]?"here":""}"><td>${r[4]?"▶ ":""}${r[0]}</td><td class="num">${r[1]}</td><td class="num">${r[2]}</td><td class="num">${r[3]}</td></tr>`).join("")}</table>`;
const cards=[
 {k:"lda",name:"LDA",short:"Akkumulator laden",flags:["N","Z"],tab:lda,here:"Sofortwert (imm) · A9 00 · 2 Zyklen",ex:"lda #$00"},
 {k:"jmp",name:"JMP",short:"Sprung",flags:[],tab:jmp,here:"Absolut (abs) · 4C 87 08 · 3 Zyklen",ex:"jmp $0887"},
 {k:"STERNE",name:"STERNE",short:"#define-Konstante (Zeile 2)",val:"5",desc:"Vor dem Nummerieren wird der Name durch den Wert ersetzt (nicht in Zeichenketten und nach REM).",ex:"#define STERNE 5"},
 {k:"#if",name:"#if",short:"Bedingte Übernahme",desc:"Nimmt die folgenden Zeilen nur auf, wenn die Bedingung gilt: SYSTEM_C64 (Zielsystem) oder ein definierter Name (wahr, wenn sein Wert nicht 0 ist). Ausgeschlossene Zeilen erscheinen grau.",ex:"#if SYSTEM_C128 … #else … #endif"}];
const A=(c)=>`<div class="c A"><div class="hd"><span class="t">${c.name}</span><span class="k">${c.short}</span></div><div class="bd">
 ${c.flags&&c.flags.length?`<div><h4>Flags</h4><div style="margin-top:3px">${c.flags.map(f=>`<span class="pill">${f}</span>`).join("")}</div></div>`:""}
 ${c.tab?`<div><h4>Adressierungen</h4><div style="margin-top:3px">${tab(c.tab)}</div></div>`:`<div>${c.val?`<h4>Wert</h4><code class="ex" style="margin:3px 0 8px">${c.val}</code>`:""}<h4>Beschreibung</h4><div style="margin-top:3px">${c.desc}</div></div>`}
 <div><h4>Beispiel</h4><code class="ex" style="margin-top:3px">${c.ex}</code></div></div>${c.here?`<div class="ft">Diese Zeile: <b>${c.here}</b></div>`:""}</div>`;
const B=(c)=>`<div class="c B"><div class="hd"><span class="t">${c.name}</span><span class="k">${c.short}</span></div><div class="bd">
 ${c.flags&&c.flags.length?`<div><h4>Beeinflusst die Flags</h4>${c.flags.map(f=>`<span class="pill">${f}</span>`).join("")}</div>`:""}
 ${c.here?`<div class="box"><h4>Diese Zeile</h4><b>${c.here}</b></div>`:""}
 ${c.tab?tab(c.tab):`<div>${c.val?`Wert: <code class="pill">${c.val}</code><br>`:""}${c.desc}</div>`}
 <code class="ex">${c.ex}</code></div></div>`;
const C=(c)=>`<div class="c C"><div class="row"><div class="l"><span class="t">${c.name}</span><span class="k">${c.short}</span>${c.flags&&c.flags.length?`<div>${c.flags.map(f=>`<span class="pill">${f}</span>`).join("")}</div>`:""}<code class="ex">${c.ex}</code></div>
 <div class="r">${c.tab?tab(c.tab):`<div>${c.val?`<b>Wert</b> <code class="pill">${c.val}</code><br><br>`:""}${c.desc}</div>`}</div>${c.here?`<div class="ft">Diese Zeile: <b>${c.here}</b></div>`:""}</div></div>`;
const F={A,B,C}[V];
document.getElementById("g").innerHTML=cards.map(c=>`<div><p class="lab">${c.k}</p>${F(c)}</div>`).join("");
</script>
