# cargo-deny: Lizenz- und Sicherheitsprüfung der Abhängigkeiten (cargo deny check licenses / advisories)
[graph]
all-features = true

[licenses]
# nur diese SPDX-Kennungen sind erlaubt (GPL-3.0-or-later ist unsere eigene Lizenz)
allow = [
    "GPL-3.0-or-later", "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "Zlib", "Unicode-3.0", "MPL-2.0", "CC0-1.0", "0BSD", "BSL-1.0", "Unlicense", "NCSA",
]
confidence-threshold = 0.8

[advisories]
version = 2
ignore = [
    # proc-macro-error: nur "unmaintained" (keine Schwachstelle), transitiv über GTK/Tauri (Linux-Fenster), kein Fix verfügbar, bei Tauri-Update erneut prüfen (2026-11-24)
    "RUSTSEC-2024-0370",
    # paste: nur "unmaintained" (keine Schwachstelle), transitiv über Oberflächen- und Grafikbibliotheken, kein Fix verfügbar, bei Tauri-Update erneut prüfen (2026-11-24)
    "RUSTSEC-2024-0436",
    # ttf-parser: nur "unmaintained" (keine Schwachstelle), transitiv über Schrift-/Grafikbibliotheken, kein Fix verfügbar, bei Tauri-Update erneut prüfen (2026-11-24)
    "RUSTSEC-2026-0192",
    # zvariant: nur "unmaintained" (keine Schwachstelle), transitiv über tauri-plugin-single-instance/zbus, kein Fix verfügbar, bei Tauri-Update erneut prüfen (2026-11-24)
    "RUSTSEC-2026-0370",
    # zbus_names: nur "unmaintained" (keine Schwachstelle), transitiv über tauri-plugin-single-instance/zbus, kein Fix verfügbar, bei Tauri-Update erneut prüfen (2026-11-24)
    "RUSTSEC-2026-0371",
    # zvariant_derive: nur "unmaintained" (keine Schwachstelle), transitiv über tauri-plugin-single-instance/zbus, kein Fix verfügbar, bei Tauri-Update erneut prüfen (2026-11-24)
    "RUSTSEC-2026-0372",
]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
