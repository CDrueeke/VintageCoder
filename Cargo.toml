[workspace]
resolver = "2"
members = ["crates/vc-core", "crates/vc-target", "crates/vc-asm", "crates/vc-cli", "crates/vc-lsp", "crates/vc-basic", "crates/vc-disk", "crates/vc-ide", "crates/vc-emu", "crates/vc-media", "crates/vc-roms", "crates/vc-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
